<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deck Selection</title>
    <link rel="stylesheet" href="deck-styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/config.js"></script>
<script src="/game/game-auth.js"></script>
</head>
<body>
    <div class="container">
        <h1>Deck Selection</h1>
        <form id="deck-selection-form">
            <label for="deck">Choose Your Deck:</label>
            <select id="deck" name="deck" required>
                <option value="">Loading decks...</option>
            </select>

            <button type="submit">Start Game</button>
        </form>
    </div>
    <script src="deck-script.js"></script>
</body>
</html>
