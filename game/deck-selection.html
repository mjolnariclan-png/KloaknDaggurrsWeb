<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deck Selection</title>
    <link rel="stylesheet" href="../assets/css/deck-styles.css">
</head>
<body>
    <div class="container">
        <h1>Deck Selection</h1>
        <form id="deck-selection-form">
            <label for="deck">Choose Your Deck:</label>
            <select id="deck" name="deck" required>
                <option value="">Loading decks...</option>
            </select>

            <button type="submit">Start Game</button>
        </form>
        <button id="back-to-menu-btn" class="btn ghost">Back to Menu</button>
    </div>
    <script src="../assets/js/deck-script.js"></script>
</body>
</html>
