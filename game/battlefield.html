<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Responsive Battlefield</title>
    <link rel="stylesheet" href="../assets/css/battlefield-styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/config.js"></script>
<script src="/game/game-auth.js"></script>
</head>
<body>
    <div class="game-container">
        <!-- Game Header -->
        <div class="game-header">
            <div class="player-info">
                <span class="player-name">Player</span>
                <span class="scallous-count">Scallous: 30</span>
                <span class="vigor-count">Vigor: 0</span>
            </div>
            <div class="turn-info">
                <span class="turn-indicator">Your Turn</span>
                <span class="turn-number">Turn: 1</span>
                <span class="turn-phase">Vigor Reset</span>
            </div>
            <div class="opponent-info">
                <span class="opponent-name">Opponent</span>
                <span class="opponent-scallous">Scallous: 30</span>
                <span class="opponent-vigor">Vigor: 0</span>
            </div>
            <div class="menu-toggle">
                <button id="menu-toggle-btn">✕</button>
            </div>
        </div>
        
        <!-- Main Battlefield Area -->
        <div class="battlefield-container" id="battlefield-container">
            <!-- Opponent Battlefield -->
            <div class="opponent-zones">
                <div class="zone opponent-battlefield-zone" id="opponent-battlefield-zone">
                    <div class="zone-label">Opponent Battlefield</div>
                    <div class="zone-content" id="opponent-battlefield"></div>
                </div>
            </div>

            <!-- Player Battlefield -->
            <div class="player-zones">
                <div class="zone player-battlefield-zone" id="player-battlefield-zone">
                    <div class="zone-label">Your Battlefield</div>
                    <div class="zone-content" id="player-battlefield"></div>
                </div>
            </div>
        </div>

        <!-- Player Hand Overlay (hidden by default) -->
        <div class="zone player-hand-zone" id="player-hand-zone">
            <div class="zone-label">Your Hand</div>
            <div class="zone-content" id="player-hand"></div>
        </div>

        <!-- Hand Toggle Button -->
        <button class="hand-toggle" id="hand-toggle">Hand</button>

        <!-- Game Controls -->
        <div class="game-controls">
            <button id="draw-card-btn" class="control-btn">Draw Card (D)</button>
            <button id="auto-play-vigor-btn" class="control-btn">Auto-Play Vigor</button>
            <button id="end-turn-btn" class="control-btn">End Turn (Space)</button>
        </div>

        <!-- Side Menu -->
        <div class="side-menu" id="side-menu">
            <div class="side-menu-content">
                <h3>Menu</h3>
                <button id="quit-btn" class="side-menu-btn">Quit to Website</button>
                <button id="menu-btn" class="side-menu-btn">Return to Main Menu</button>
            </div>
        </div>
        
        <!-- Mode Selection -->
        <div class="mode-selection" id="mode-selection" style="display: none;">
            <button id="ai-mode-btn" class="mode-btn">Play vs AI</button>
            <button id="twoplayer-mode-btn" class="mode-btn">2 Player Mode</button>
        </div>
        
        <!-- Timer Display -->
        <div id="timer-display" class="timer-display" style="display: none;">
            <span id="timer-countdown">60</span>s
        </div>
        
        <!-- Cross-Bracket Notification -->
        <div id="cross-bracket-notification" class="cross-bracket-notification" style="display: none;">
            ⚠️ Cross-bracket match detected
        </div>
    </div>

    <script type="module" src="../assets/js/battlefield.js"></script>
</body>
</html>
